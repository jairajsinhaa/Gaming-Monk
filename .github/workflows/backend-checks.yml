name: Gaming Monk backend checks

on:
  push:
    branches: [gaming-monk-backend-auth]
    paths:
      - "server/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  prisma-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gaming_monk?schema=public
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gaming_monk?schema=public
